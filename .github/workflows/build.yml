name: build

on:
  push:
    paths-ignore:
      - 'data/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'data/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Jenesis dependency cache
        uses: actions/cache@v4
        with:
          path: .jenesis/cache
          key: jenesis-${{ hashFiles('pom.xml', 'tests/module-info.java') }}
          restore-keys: jenesis-

      - name: Build and test with Jenesis
        run: java build/jenesis/Project.java
