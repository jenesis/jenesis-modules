name: Backfill canonical publishedAt timestamps

# Walks data/modules/, HEADs each row's artifact for its canonical Last-Modified, rewrites
# versions.tsv where the on-disk publication timestamp differs, then regenerates the resolved
# views (artifacts.tsv, modules.tsv) for every module whose version files were touched. Brings
# the audit log to the state it would have if the crawler had always sourced publishedAt from
# the storage layer's Last-Modified rather than the Nexus index's per-record timestamp.
#
# Manual only - schedule a moment when no crawl or reconcile is running. Shares the `crawl`
# concurrency group with crawl.yml and reconcile-metadata.yml so workflows on the same data
# files serialise rather than fighting each other.

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: Concurrent HEAD fetches (default 64)
        required: false
        default: '64'
      commit_every:
        description: Modules between checkpoint commits (default 100)
        required: false
        default: '100'
      push_every:
        description: Checkpoint commits between pushes (default 5)
        required: false
        default: '5'

permissions:
  contents: write

# Share the crawl concurrency group so this queues behind any in-flight crawl / reconcile
# instead of stomping on the same versions.tsv files.
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 320

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 50
          persist-credentials: true
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true

      - name: Run PatchTimestamp
        env:
          ARTIFACT_BASE: ${{ vars.ARTIFACT_BASE || 'https://maven-central.storage-download.googleapis.com/maven2/' }}
          # HEAD target for the canonical Last-Modified. When ARTIFACT_BASE is a mirror that
          # rewrites mtimes (the GCS mirror serves pre-2019 imports with bucket-landing times
          # rather than publish times), point this at Maven Central so HEADs return the
          # original publication time. Same property as the crawler.
          CANONICAL_TIMESTAMP_BASE: ${{ vars.CANONICAL_TIMESTAMP_BASE || 'https://repo.maven.apache.org/maven2/' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '64' }}
          PUSH_EVERY: ${{ github.event.inputs.push_every || vars.GIT_PUSH_EVERY || '5' }}
          COMMIT_EVERY: ${{ github.event.inputs.commit_every || '100' }}
        run: |
          set -euo pipefail
          java -XX:+ExitOnOutOfMemoryError \
               -XX:+HeapDumpOnOutOfMemoryError \
               -XX:HeapDumpPath="$GITHUB_WORKSPACE/patch.hprof" \
               -Djenesis.crawler.data="$GITHUB_WORKSPACE/data" \
               -Djenesis.crawler.concurrency="$CONCURRENCY" \
               -Djenesis.crawler.canonical.timestamp.uri="$CANONICAL_TIMESTAMP_BASE" \
               -Djenesis.crawler.git.publish=true \
               -Djenesis.crawler.git.work.dir="$GITHUB_WORKSPACE" \
               -Djenesis.crawler.git.push.every="$PUSH_EVERY" \
               -Djenesis.patch.commit.every="$COMMIT_EVERY" \
               sources/build/jenesis/crawler/PatchTimestamp.java \
               "$ARTIFACT_BASE"

      - name: Upload heap dump on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: patch-heap-dump-${{ github.run_id }}
          path: patch.hprof
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Commit the backfill
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git add data
          if git diff --cached --quiet; then
            echo "PatchTimestamp made no changes to data/."
            exit 0
          fi
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git commit -m "patch: backfill canonical publishedAt $stamp"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase || true
          done
          echo "Final push failed after 3 attempts" >&2
          exit 1
