name: Update module summary

on:
  schedule:
    # 06:07 UTC daily, halfway between the 00:07 and 12:07 crawl runs.
    - cron: '7 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-latest
    # The bleeding report reads one directory listing per release in the rolling year, for every
    # artifact of every listed groupId - a few hundred thousand requests, around twelve minutes.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 5
          persist-credentials: true
          submodules: recursive

      - name: Set up JDK 26
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '26'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true

      - name: Regenerate frozen per-year top-module tables
        run: |
          set -euo pipefail
          # Freeze every completed year's list to data/top/<year>.md (rendered as of that year end) —
          # this is what creates the first 2025.md now that 2025 is a completed year. The bleeding run
          # below additionally renders the latest list as a current-state view.
          java -Djenesis.crawler.data="$GITHUB_WORKSPACE/data" \
               sources/build/jenesis/crawler/TopModules.java data/top/*.txt

      - name: Regenerate bleeding edge report
        run: |
          set -euo pipefail
          # Only the bleeding report carries the publishing columns. They are measured per groupId
          # over every artifact of that group, not per listed artifact, because a group is what
          # Maven Central caps - which costs one directory-listing request per release in the
          # rolling year. Affordable once; not once per frozen year as well, so the tables above
          # stay offline without them.
          java -Djenesis.crawler.data="$GITHUB_WORKSPACE/data" \
               -Djenesis.crawler.top.bleeding=true \
               -Djenesis.crawler.top.releases.uri=https://repo1.maven.org/maven2/ \
               sources/build/jenesis/crawler/TopModules.java data/top/*.txt

      - name: Regenerate SUMMARY.md
        run: |
          set -euo pipefail
          java -Djenesis.crawler.data="$GITHUB_WORKSPACE/data" \
               sources/build/jenesis/crawler/ModuleSummary.java

      - name: Regenerate DRIFTERS.md
        run: |
          set -euo pipefail
          java -Djenesis.crawler.data="$GITHUB_WORKSPACE/data" \
               sources/build/jenesis/crawler/DriftReport.java

      - name: Regenerate module-maven.properties
        run: |
          set -euo pipefail
          java sources/build/jenesis/crawler/ModuleMaven.java > data/module-maven.properties

      - name: Commit and push if the summary, top-module tables, DRIFTERS, or module-maven.properties changed
        run: |
          set -euo pipefail
          # data/top/*.md covers BLEEDING.md and every per-year table (e.g. the first 2025.md), which
          # TopModules regenerates from each data/top/<year>.txt but the commit step previously dropped.
          git add data/SUMMARY.md data/top/*.md data/DRIFTERS.md data/module-maven.properties
          if git diff --cached --quiet; then
            echo "Summary, top-module tables, DRIFTERS, and module-maven.properties unchanged; nothing to commit."
            exit 0
          fi
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git commit -m "summary: regenerate $stamp"
          # The daily summary may race with the 12-hourly crawl's commits; rebase-retry
          # handles the common case where a crawl checkpoint landed since checkout.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase || true
          done
          echo "Final push failed after 3 attempts" >&2
          exit 1
