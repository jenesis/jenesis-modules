project:
  name: jenesis-modules
  description: Crawls Maven Central and records Java module names per artifact coordinate.
  authors: [Rafael Winterhalter]
  license: Apache-2.0
  links:
    homepage: https://github.com/raphw/jenesis-modules
  languages:
    java:
      groupId: build.jenesis
      artifactId: build.jenesis.crawler
      version: '25'

signing:
  active: ALWAYS
  pgp:
    armored: true
    mode: MEMORY

release:
  github:
    owner: raphw
    name: jenesis-modules
    branch: main
    branchPush: main
    skipRelease: false
    skipTag: false
    tagName: 'v{{projectVersion}}'

files:
  artifacts:
    - path: 'target/stage/maven/output/build/jenesis/build.jenesis.crawler/{{projectVersion}}/build.jenesis.crawler-{{projectVersion}}.jar'
    - path: 'target/stage/maven/output/build/jenesis/build.jenesis.crawler/{{projectVersion}}/build.jenesis.crawler-{{projectVersion}}-sources.jar'

deploy:
  maven:
    mavenCentral:
      sonatype:
        active: ALWAYS
        url: https://central.sonatype.com/api/v1/publisher
        applyMavenCentralRules: true
        stagingRepositories:
          - target/stage/maven/output
